name: CMake CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cmake-build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cmake_args: -DNCNN_LLM_ENABLE_VULKAN=ON -G Ninja
          - os: macos-latest
            cmake_args: -DNCNN_LLM_ENABLE_VULKAN=OFF
          - os: windows-latest
            cmake_args: -DNCNN_LLM_ENABLE_VULKAN=ON

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libvulkan-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja libomp

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Run Tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Install to Distribution Directory
        run: |
          cmake --install build --config Release --prefix dist

      - name: Package Binaries (Linux/macOS)
        if: runner.os != 'Windows'
        id: package_unix
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found."
            exit 1
          fi
          ARCHIVE_NAME="ncnn_llm_${{ runner.os }}.zip"
          cd dist
          zip -r "../$ARCHIVE_NAME" .
          cd ..
          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT

      - name: Package Binaries (Windows)
        if: runner.os == 'Windows'
        id: package_windows
        shell: powershell
        run: |
          if (-not (Test-Path "dist")) {
              Write-Error "dist directory not found."
              exit 1
          }
          $ARCHIVE_NAME = "ncnn_llm_Windows.zip"
          Compress-Archive -Path "dist\*" -DestinationPath $ARCHIVE_NAME -Force
          echo "archive_name=$ARCHIVE_NAME" >> $env:GITHUB_OUTPUT

      - name: Upload Packaged Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package_unix.outputs.archive_name || steps.package_windows.outputs.archive_name }}
          path: ${{ steps.package_unix.outputs.archive_name || steps.package_windows.outputs.archive_name }}
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: [cmake-build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
